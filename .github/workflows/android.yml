name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify and build APKs
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GridLauncher-debug.apk

      - name: Publish PR preview release asset
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}-preview"
          ASSET="GridLauncher-pr-${PR_NUMBER}.apk"
          cp dist/GridLauncher-debug.apk "$ASSET"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "$ASSET#Installable GridLauncher APK for PR #${PR_NUMBER}" \
            --target "$BUILD_SHA" \
            --title "GridLauncher PR #${PR_NUMBER} preview" \
            --notes "Automated installable debug APK generated by Android CI for PR #${PR_NUMBER}." \
            --prerelease \
            --latest=false

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: gridlauncher-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/GridLauncher-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gridlauncher-lint-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: app/build/reports/lint-results-debug.html
